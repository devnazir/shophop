name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ matches the source
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo "::error::dist/ is out of date. Run 'npm run build' and commit dist/."; exit 1; }
